name: Build release package

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out the released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - name: Check release versions
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('npm-shrinkwrap.json', 'utf8'));
          const installer = readFileSync('install.sh', 'utf8');
          assert.equal(pkg.name, 'pi-experiment-ops');
          assert.match(pkg.version, /^\d+\.\d+\.\d+(?:-[a-zA-Z0-9.-]+)?$/);
          assert.equal(process.env.RELEASE_TAG, `v${pkg.version}`, 'Release tag must match package.json');
          assert.equal(lock.version, pkg.version, 'Update the shrinkwrap version');
          assert.equal(lock.packages[''].version, pkg.version, 'Update the shrinkwrap root package version');
          assert.equal(installer.match(/^version=(.+)$/m)?.[1], pkg.version, 'Update the installer default version');
          JS

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.8.15'
          enable-cache: false

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Provision Python runtime
        run: bash scripts/install.sh --runtime-only

      - name: Run integration tests
        run: npm test

      - name: Test installation from the package tarball
        run: npm run test:package

      - name: Build release assets
        run: |
          mkdir -p release-assets
          npm pack --pack-destination release-assets
          cd release-assets
          sha256sum "pi-experiment-ops-${RELEASE_TAG#v}.tgz" > "pi-experiment-ops-${RELEASE_TAG#v}.tgz.sha256"
          sha256sum -c "pi-experiment-ops-${RELEASE_TAG#v}.tgz.sha256"

      - name: Upload assets to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for asset in \
            "release-assets/pi-experiment-ops-${RELEASE_TAG#v}.tgz" \
            "release-assets/pi-experiment-ops-${RELEASE_TAG#v}.tgz.sha256"; do
            for attempt in 1 2 3 4 5; do
              if gh release upload "$RELEASE_TAG" "$asset" --clobber; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "::error::Failed to upload $asset after $attempt attempts"
                exit 1
              fi
              delay=$((5 * (1 << (attempt - 1))))
              echo "::warning::Upload failed for $asset; retrying in ${delay}s"
              sleep "$delay"
            done
          done
